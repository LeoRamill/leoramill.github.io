# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/

# Appearance
appearance:
  mode: system   # light | dark | system
  color: indigo  # accent colour (change to red, rose, blue, emerald... see Hugo Blox themes)

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Personal website of Leonard Vincent Ramil, Computer Science and AI student: projects, news and CV.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    show_logo: true
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    # Push the menu to the right, like the original site (social icons stay on the left)
    align: right
    logo:
      # Leave `text` empty to show only the social icons on the left of the navbar
      text: ""
      # Logo filename in `assets/media/` folder (shown as a small round avatar)
      filename: "icon.jpg"

# Site footer
footer:
  copyright:
    notice: '© {year} Leonard Vincent Ramil. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false

# Publications
publications:
  # Every spelling of your own name, so it comes out in bold in the author lists
  highlight_authors:
    - Leonard Vincent Ramil
    - Vincent Leonard Ramil
    - L. V. Ramil
    - Leonard V. Ramil
